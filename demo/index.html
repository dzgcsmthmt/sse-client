    <body>
        <div id="app"></div>

        <script type="module">
            import { SSEInstance, BaseFilter } from "/dev.esm.js";
            class MessageFilter extends BaseFilter {
                constructor() {
                    super();
                    this.filterType = "message";
                }

                /**
                 * 判断是否可以处理内容消息
                 * @param {Object} msg - 消息对象
                 * @returns {boolean}
                 */
                canHandle(msg) {
                    return msg.event === "chat_reply";
                }

                /**
                 * 处理内容消息
                 * @param {Object} msg - 消息对象
                 * @param {SSEInstance} sseInstance - SSE实例
                 * @returns {boolean}
                 */
                process(msg, sseInstance) {
                    sseInstance.emit("message", msg.message_id, msg.data);
                    return true;
                }
            }

            /**
             * 初始化Vue应用实例
             * 创建Vue实例来管理页面状态和数据
             */

                el: "#app",
                data: {
                    isGenerating: false,
                    generateDone: false,
                    generateError: false,
                    generateAbort: false,
                    msg: "",
                    thinkingMsg: "",
                    messageId: "",
                },
                mounted() {
                    this.initSse();
                },
                methods: {

                        this.sse = new SSEInstance(
                            "https://gateway.pkulaw.com/pkulaw-chat-gpt-api-4/6.0.0.0/gpt/writer/aswDialogue", // 示例URL
                            {
                                data: {
                                    model: "deepseek-v3",
                                    ask: "麦当劳案",
                                    withContext: true,
                                },
                                headers: {
                                    Authorization: this.token,
                                },
                                // refresh_token_address:
                                //     "https://test1.pkulaw.com",
                                refreshTokenSuccessed:
                                    this.handleRefreshTokenSuccessed,
                                refreshToken: this.handleTokenRefresh,
                            },
                        );

                        this.sse.filterManager.replaceFilter(
                            "message",
                            new MessageFilter(),
                        );

                        // 监听各种事件
                        this.sse.on("rawMessage", this.handleRawMessageEvent);
                        this.sse.on("thinking", this.handleThinkingEvent);
                        this.sse.on("message", this.handleMessageEvent);
                        this.sse.on("error", this.handleSSEError);
                        this.sse.on("close", this.handleCloseEvent);
                    },
                    handleRefreshTokenSuccessed(data) {
                        console.log("refresh token successed", data);
                    },
                    handleTokenRefresh(token) {
                        return fetch(
                            "https://www.pkulaw.com/gateway/account/auth/refreshtoken",
                            {
                                method: "POST",
                                body: JSON.stringify({
                                    access_token: token.slice(7),
                                    client_id: "pkulaw",
                                }),
                                headers: {
                                    "Content-Type": "application/json",
                                },
                            },
                        ).then((response) => {
                            if (!response.ok) {
                                throw new Error("refresh token failed");
                            }
                            return response.json();
                        });
                    },
                    /**
                     * 开始SSE连接
                     * 创建SSE实例并监听事件
                     */
                    startConnection() {
                        console.log("开始连接");
                        this.sse.connect();
                    },

                    /**
                     * 停止SSE连接
                     * 关闭当前连接并清理状态
                     */
                    stopConnection() {
                        if (this.sse) {
                            this.sse.abort();
                        }
                    },
                    handleRawMessageEvent(msg) {
                        console.log("rawMessage", msg);
                    },
                    handleSSEError(error) {
                        if (error.status === 401) {
                            console.log("您的登录状态已失效，还请重新登录");
                        } else if (error.status === 500) {
                            console.log("服务器错误:", error.message);
                        } else if (error.status === 422) {
                            console.log("数据格式错误:", error.message);
                        } else {
                            console.log(error.message);
                        }
                    },
                    /**
                     * 处理思考事件
                     */
                    handleThinkingEvent(data) {
                        this.thinkingMsg += data;
                    },
                    /**
                     * 处理消息事件
                     */
                    handleMessageEvent(messageId, data) {
                        this.messageId = messageId;
                        this.msg += data;
                    },
                    handleCloseEvent() {
                        console.log("close");
                    },
                },
                template: `
                    <div>
                        <div style="margin-bottom: 20px;">
                            <h2>SSE客户端测试</h2>
                        </div>
                        <div style="margin-bottom: 20px;">
                            <button @click="startConnection" style="margin-right: 10px;">
                                开始连接
                            </button>
                            <button @click="stopConnection" style="margin-right: 10px;">
                                停止连接
                            </button>
                        </div>
                        <div style="border: 1px solid #ccc; padding: 15px; background: #f9f9f9; max-height: 400px; overflow-y: auto;">
                            <h3>接收到的内容:{{messageId}}</h3>
                            <div v-html="thinkingMsg"></div>
                            <div v-html="msg"></div>
                        </div>
                    </div>
                `,
            });
        </script>
    </body>
</html>
